<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      resize: vertical;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #0056b3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>

<h1>🎙️ Live Storytelling</h1>
<textarea id="story" placeholder="Enter your story here...">The last train pulled away from the platform at midnight. Sarah stood alone, watching its red lights disappear into the tunnel. She'd missed it by thirty seconds. Thirty seconds that changed everything.

Her phone buzzed. Unknown number. Against her better judgment, she answered. "Sarah?" The voice was her own. Exactly her own. "Don't go home tonight. Please. I'm calling from three hours in your future, and if you go home now, you won't make it to morning."

Her hand trembled. This had to be a prank. Some AI voice clone, probably. But the voice continued, urgent and desperate. "I know what you're thinking. Check your left jacket pocket. There's a coffee receipt from this morning. Barista wrote 'Have a magical day' with a star next to it. Your mom texted you at 2:47 PM asking about Thanksgiving. You haven't replied yet because you're still mad about last year."

Sarah's blood ran cold. Her hand moved to her pocket. The receipt was there. The star. Everything.

"Who are you?" she whispered.

"I told you. I'm you. In my timeline, I went home. I walked up to my apartment, and someone was waiting. I never saw his face. But somehow, impossibly, I'm still conscious. Still here. Trapped in these three hours, able to make one call. This call. To save you. To save us."

The station was empty. Silent. Sarah's breathing echoed against the tiled walls.

"What do I do?"

"There's a coffee shop two blocks north. It's open all night. Stay there until sunrise. Trust me. Please. This is the only chance we have to get it right."

The line went dead. Sarah stood frozen, her heart pounding. Every rational part of her brain screamed that this was impossible. But her feet were already moving. North. Toward the coffee shop. Toward sunrise. Toward a future that, maybe, she could still have.</textarea>

<button id="speakBtn" onclick="start()">🎙️ Start Story</button>
<div id="status"></div>
<audio id="audio" autoplay></audio>

<script>
let pc = null;

async function start() {
  const btn = document.getElementById('speakBtn');
  const status = document.getElementById('status');
  const storyText = document.getElementById('story').value;

  if (!storyText.trim()) {
    status.textContent = 'Please enter a story first!';
    return;
  }

  btn.disabled = true;
  status.textContent = 'Connecting...';

  try {
    pc = new RTCPeerConnection();

    pc.ontrack = e => {
      console.log('Track received:', e.track.kind);
      audio.srcObject = e.streams[0];
      status.textContent = '🎵 Playing...';
    };

    pc.oniceconnectionstatechange = () => {
      console.log('ICE connection state:', pc.iceConnectionState);
    };

    pc.onconnectionstatechange = () => {
      console.log('Connection state:', pc.connectionState);
      if (pc.connectionState === 'connected') {
        status.textContent = '🎵 Streaming audio...';
      } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'closed') {
        status.textContent = 'Story complete!';
        btn.disabled = false;
      }
    };

    // Add transceiver to receive audio from server
    pc.addTransceiver('audio', { direction: 'recvonly' });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    status.textContent = 'Generating story...';

    const res = await fetch(
      "https://paarijatthakur--aiden-webrtc-tts-web.modal.run/offer",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sdp: offer.sdp,
          type: offer.type,
          text: storyText
        })
      }
    );

    if (!res.ok) {
      throw new Error(`Server error: ${res.status}`);
    }

    const answer = await res.json();
    await pc.setRemoteDescription(answer);
  } catch (error) {
    console.error('Error:', error);
    status.textContent = `Error: ${error.message}`;
    btn.disabled = false;
  }
}
</script>

</body>
</html>
